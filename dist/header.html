<!doctype html>
<!-- Header webview: navigation and window controls. State comes from Rust via window.weboverlay.update(). -->
<html>
<head>
<meta charset="utf-8">
<title>WebOverlay header</title>
<style>
  :root {
    --bg: #f3f4f6;
    --fg: #111827;
    --muted: #6b7280;
    --hover: rgba(0, 0, 0, 0.08);
    --active: rgba(0, 0, 0, 0.14);
    --border: #d1d5db;
    --close: #dc2626;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2937;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --hover: rgba(255, 255, 255, 0.1);
      --active: rgba(255, 255, 255, 0.18);
      --border: #374151;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 12px system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 0 0 4px;
    border-bottom: 1px solid var(--border);
  }
  .group { display: flex; align-items: center; gap: 2px; flex: none; }
  button {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  button:hover { background: var(--hover); }
  button:active { background: var(--active); }
  button:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #page {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    padding: 0 12px;
    line-height: 29px;
    white-space: nowrap;
  }
  #favicon, #favicon-default { width: 14px; height: 14px; flex: none; align-self: center; }
  #favicon { object-fit: contain; }
  #favicon-default { color: var(--muted); }
  #favicon[hidden], #favicon-default[hidden] { display: none; }
  #title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  #url { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 0 10 auto; min-width: 40px; }
  #url-input {
    flex: 1;
    min-width: 0;
    height: 22px;
    align-self: center;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--hover);
    color: inherit;
    font: inherit;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #url-input:focus { border-color: #2563eb; }
  #page.editing > :not(#url-input) { display: none !important; }
  #find { flex: 1; min-width: 0; max-width: 460px; display: flex; align-items: center; gap: 2px; align-self: center; }
  #find-field { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
  #find-input { flex: 1; min-width: 0; height: 22px; padding: 0 70px 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--hover); color: inherit; font: inherit; outline: none; user-select: text; -webkit-user-select: text; }
  #find-input:focus { border-color: #2563eb; }
  #find.none #find-input { border-color: var(--close); }
  #find-options { position: absolute; right: 2px; display: flex; gap: 1px; }
  #find-options button { width: 22px; height: 18px; border: 1px solid transparent; border-radius: 4px; font: 600 11px ui-monospace, "Cascadia Mono", Menlo, monospace; color: var(--muted); }
  #find-options button[aria-pressed="true"] { color: var(--fg); background: rgba(37, 99, 235, 0.22); border-color: #2563eb; }
  #find-options u { text-decoration-thickness: 1px; text-underline-offset: 2px; }
  #find-count { min-width: 72px; padding: 0 6px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #find.none #find-count, #find.error #find-count { color: var(--close); }
  #page.finding > :not(#find) { display: none !important; }
  #failure { width: auto; height: 22px; align-self: center; padding: 0 8px; gap: 6px; display: flex; align-items: center; color: var(--close); font-weight: 600; }
  #page.failed > #title, #page.failed > #url { display: none; }
  #zoom { width: 40px; border-radius: 6px; font-variant-numeric: tabular-nums; font-size: 11px; }
  .sep { width: 1px; height: 16px; margin: 0 4px; background: var(--border); flex: none; }
  .win button { width: 40px; height: 29px; border-radius: 0; }
  .win svg { width: 12px; height: 12px; stroke-width: 1.5; }
  .win #close:hover { background: var(--close); color: #fff; }
  [data-item="downloads"] { position: relative; }
  [data-item="downloads"][data-badge]::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--bg);
  }
  [data-item="downloads"][data-badge="running"]::after { background: #2563eb; animation: pulse 1s ease-in-out infinite alternate; }
  [data-item="downloads"][data-badge="done"]::after { background: #16a34a; }
  @keyframes pulse { to { opacity: 0.3; } }
  #restore-icon { display: none; }
  body.maximized #maximize-icon { display: none; }
  body.maximized #restore-icon { display: block; }
</style>
</head>
<body>
  <div class="group">
    <button data-item="back" data-action="back" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button data-item="forward" data-action="forward" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button data-item="reload" data-action="reload" title="Reload (F5)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button data-item="home" data-action="home" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>
  </div>

  <div id="page">
    <img id="favicon" alt="" hidden>
    <svg id="favicon-default" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    <button id="failure" data-action="reload" title="Reload (F5)" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
      <span id="failure-text"></span>
      <span>· Reload</span>
    </button>
    <span id="title" data-item="title"></span>
    <span id="url" data-item="url"></span>
    <input id="url-input" type="text" spellcheck="false" autocomplete="off" hidden>
    <div id="find" hidden>
      <div id="find-field">
        <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page">
        <div id="find-options">
          <button data-option="case" title="Match Case (Alt+C)" aria-pressed="false">Aa</button>
          <button data-option="word" title="Match Whole Word (Alt+W)" aria-pressed="false"><u>ab</u></button>
          <button data-option="regex" title="Use Regular Expression (Alt+R)" aria-pressed="false">.*</button>
        </div>
      </div>
      <span id="find-count"></span>
      <button data-find="find_prev" title="Previous Match (Shift+Enter, Shift+F3)">
        <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
      <button data-find="find_next" title="Next Match (Enter, F3)">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button data-find="find_close" title="Close (Escape)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="group">
    <span class="group" data-item="zoom">
    <button data-action="zoom_out" title="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button id="zoom" data-action="zoom_reset" title="Reset zoom">100%</button>
    <button data-action="zoom_in" title="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    </span>
    <span class="sep" id="zoom-sep"></span>
    <button data-item="downloads" data-action="downloads" title="Downloads" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
    <button data-item="vault" data-action="vault" title="Fill the saved login / open the vault">
      <svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3"/><path d="M16 7l3 3"/><path d="M14 9l2 2"/></svg>
    </button>
    <button data-item="edit" data-action="edit" title="Edit config">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button data-item="devtools" data-action="devtools" title="Developer tools (F12)">
      <svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg>
    </button>
    <button data-item="external" data-action="external" title="Open in browser">
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </button>
  </div>

  <div class="group win">
    <button data-action="minimize" title="Minimize">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button data-action="toggle_maximize" title="Maximize">
      <svg id="maximize-icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg>
      <svg id="restore-icon" viewBox="0 0 24 24"><rect x="5" y="8" width="11" height="11"/><path d="M8 8V5h11v11h-3"/></svg>
    </button>
    <button id="close" data-action="close" title="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

<script>
  const invoke = (action, args = {}) =>
    window.__TAURI_INTERNALS__.invoke("header_action", { action, ...args }).catch((e) => console.error(action, e));

  const $ = (id) => document.getElementById(id);

  // Header settings of the app (`[app.header]`), set by Rust as an initialization script.
  const setup = window.weboverlaySetup || { vars: [], color_scheme: null, hide: [] };
  for (const [name, value] of setup.vars) document.documentElement.style.setProperty(name, value);
  if (setup.color_scheme) document.documentElement.style.colorScheme = setup.color_scheme;
  const hidden = new Set(setup.hide);
  for (const el of document.querySelectorAll("[data-item]")) {
    if (hidden.has(el.dataset.item)) el.setAttribute("hidden", "");
  }
  $("zoom-sep").hidden = hidden.has("zoom") || ["downloads", "vault", "edit", "devtools", "external"].every((item) => hidden.has(item));
  const hideFavicon = hidden.has("favicon");

  const showFavicon = (ok) => {
    // `hidden` is not an SVGElement property: toggle the attribute.
    $("favicon").toggleAttribute("hidden", hideFavicon || !ok);
    $("favicon-default").toggleAttribute("hidden", hideFavicon || ok);
  };
  if (hideFavicon) showFavicon(false);
  $("favicon").addEventListener("load", () => showFavicon(true));
  $("favicon").addEventListener("error", () => showFavicon(false));

  let faviconUrl = null;
  const setFavicon = (url) => {
    if (url === faviconUrl) return;
    faviconUrl = url;
    if (url) $("favicon").src = url;
    else {
      $("favicon").removeAttribute("src");
      showFavicon(false);
    }
  };

  let pageUrl = "";
  const input = $("url-input");
  const stopEditing = () => {
    input.hidden = true;
    $("page").classList.remove("editing");
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const url = input.value.trim();
      stopEditing();
      if (url && url !== pageUrl) invoke("navigate", { url });
    } else if (e.key === "Escape") {
      e.preventDefault();
      stopEditing();
    }
    e.stopPropagation();
  });
  input.addEventListener("blur", stopEditing);

  // Find in page (Ctrl+F, caught natively in the content): `FIND_JS` of src/find.rs runs in the
  // content page, results come back through `findResult`.
  const findBar = $("find");
  const findInput = $("find-input");
  const findOptions = { case: false, word: false, regex: false };
  try {
    Object.assign(findOptions, JSON.parse(localStorage.getItem("weboverlay.find") || "{}"));
  } catch (_) {}
  let findSeq = 0;
  const showOptions = () => {
    for (const b of findBar.querySelectorAll("[data-option]")) b.setAttribute("aria-pressed", String(!!findOptions[b.dataset.option]));
  };
  showOptions();
  const showCount = (text, state) => {
    $("find-count").textContent = text;
    findBar.classList.toggle("none", state === "none");
    findBar.classList.toggle("error", state === "error");
  };
  const runFind = (step, scroll = true) => {
    const text = findInput.value;
    if (!text) showCount("", null);
    invoke("find", { find: { text, case: !!findOptions.case, word: !!findOptions.word, regex: !!findOptions.regex, step, scroll, seq: ++findSeq } });
  };
  const toggleOption = (name) => {
    findOptions[name] = !findOptions[name];
    try { localStorage.setItem("weboverlay.find", JSON.stringify(findOptions)); } catch (_) {}
    showOptions();
    runFind(0);
  };
  const closeFind = () => {
    if (findBar.hidden) return;
    findBar.hidden = true;
    $("page").classList.remove("finding");
    findSeq++;
    invoke("find_close");
  };
  findInput.addEventListener("input", () => runFind(0));
  findInput.addEventListener("keydown", (e) => {
    const option = e.altKey && !e.ctrlKey && { c: "case", w: "word", r: "regex" }[e.key.toLowerCase()];
    if (option) {
      e.preventDefault();
      toggleOption(option);
    } else if (e.key === "Enter" || e.key === "F3") {
      e.preventDefault();
      if (findInput.value) runFind(e.shiftKey ? -1 : 1);
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeFind();
    } else if (e.ctrlKey && e.key.toLowerCase() === "f") {
      e.preventDefault();
      findInput.select();
    }
    e.stopPropagation();
  });
  for (const button of findBar.querySelectorAll("button[data-option]")) {
    // Keep the focus (and the caret) in the field.
    button.addEventListener("mousedown", (e) => e.preventDefault());
    button.addEventListener("click", () => toggleOption(button.dataset.option));
  }
  for (const button of findBar.querySelectorAll("button[data-find]")) {
    button.addEventListener("mousedown", (e) => e.preventDefault());
    button.addEventListener("click", () => {
      if (button.dataset.find === "find_close") closeFind();
      else if (findInput.value) runFind(button.dataset.find === "find_prev" ? -1 : 1);
    });
  }

  // Right click on the page title: native menu (copy / edit the URL).
  $("page").addEventListener("contextmenu", (e) => {
    if (e.target === input) return;
    e.preventDefault();
    invoke("page_menu");
  });

  window.weboverlay = {
    find() {
      stopEditing();
      const opening = findBar.hidden;
      findBar.hidden = false;
      $("page").classList.add("finding");
      findInput.focus();
      findInput.select();
      if (opening && findInput.value) runFind(0);
    },
    findStep(step) {
      if (findBar.hidden || !findInput.value) return this.find();
      runFind(step);
    },
    findRefresh() {
      if (!findBar.hidden && findInput.value) runFind(0, false);
    },
    findResult({ seq, count, index, error, capped }) {
      if (seq !== findSeq) return;
      if (!findInput.value) showCount("", null);
      else if (error) showCount("Invalid regex", "error");
      else if (!count) showCount("No results", "none");
      else showCount(`${index + 1} of ${count}${capped ? "+" : ""}`, null);
    },
    editUrl() {
      closeFind();
      input.value = pageUrl;
      input.hidden = false;
      $("page").classList.add("editing");
      input.focus();
      input.select();
    },
    update({ title, url, favicon, zoom, maximized, downloads, downloads_badge, failure }) {
      pageUrl = url;
      const dl = document.querySelector('[data-item="downloads"]');
      dl.hidden = hidden.has("downloads") || !downloads;
      if (downloads_badge) dl.dataset.badge = downloads_badge;
      else delete dl.dataset.badge;
      dl.title = { running: "Downloads (in progress)", done: "Downloads (finished)" }[downloads_badge] || "Downloads";
      setFavicon(favicon);
      let shown = url;
      try {
        const u = new URL(url);
        shown = u.host + (u.pathname === "/" ? "" : u.pathname) + u.search;
      } catch (_) {}
      $("title").textContent = title;
      $("failure").hidden = !failure;
      $("failure-text").textContent = failure || "";
      $("page").classList.toggle("failed", !!failure);
      $("url").textContent = shown;
      $("page").title = title ? `${title}\n${url}` : url;
      $("zoom").textContent = Math.round(zoom * 100) + "%";
      document.body.classList.toggle("maximized", maximized);
      document.querySelector('[data-action="toggle_maximize"]').title = maximized ? "Restore" : "Maximize";
    },
  };

  for (const button of document.querySelectorAll("button[data-action]")) {
    button.addEventListener("click", () => invoke(button.dataset.action));
  }

  // Empty header area moves the window; double click toggles maximize.
  document.body.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.target.closest("button, input, #find")) return;
    if (e.detail === 2) invoke("toggle_maximize");
    else invoke("start_dragging");
  });

  window.addEventListener("keydown", (e) => {
    let action;
    if (e.altKey && e.key === "ArrowLeft") action = "back";
    else if (e.altKey && e.key === "ArrowRight") action = "forward";
    else if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) action = "reload";
    else if (e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "f") {
      e.preventDefault();
      return window.weboverlay.find();
    } else if (e.key === "F3" && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      return window.weboverlay.findStep(e.shiftKey ? -1 : 1);
    } else if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i")) action = "devtools";
    if (!action) return;
    e.preventDefault();
    invoke(action);
  });
</script>
</body>
</html>
