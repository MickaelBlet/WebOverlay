[package]
name = "weboverlay"
version = "0.1.2"
edition = "2021"
description = "Open any website as a standalone webapp with injected JS/CSS"
authors = ["Mickaël Blet"]
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `devtools`: web inspector in release builds too (header button, F12).
tauri = { version = "2.12", features = ["image-ico", "image-png", "unstable", "devtools"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
anyhow = "1"
url = "2"
ureq = { version = "3", features = ["platform-verifier"] }
base64 = "0.22"
# Not used directly: enables more favicon formats in `tauri::image::Image::from_bytes`.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.49"
percent-encoding = "2"
# Native "save as" dialog of the launcher (not tauri-plugin-dialog: its init script overrides
# `alert`/`confirm` in every page, remote content included).
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Download policy and popup handling of the content webview (`download.rs`), same version as wry.
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
