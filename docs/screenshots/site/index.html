<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Team Board</title>
<link rel="icon" href="icon.svg">
<!-- Fake site shown in the documentation screenshots (scripts/screenshots.sh). -->
<style>
:root { --bg: #f4f5f7; --fg: #172b4d; --bar: #fff; --line: #dfe1e6; --col: #ebecf0; --card: #fff; --muted: #5e6c84; --tag: #dfe1e6; --link: #0c66e4; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d2125; --fg: #c7d1db; --bar: #22272b; --line: #2c333a; --col: #101214; --card: #22272b; --muted: #8c9bab; --tag: #2c333a; --link: #579dff; }
}
body { margin: 0; font: 15px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { background: var(--bar); padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; }
header h1 { font-size: 18px; margin: 0; flex: 1; }
header a { color: var(--link); text-decoration: none; }
.cols { display: flex; gap: 16px; padding: 20px 24px; }
.col { background: var(--col); border-radius: 8px; padding: 10px; flex: 1; }
.col h2 { font-size: 13px; text-transform: uppercase; color: var(--muted); margin: 4px 6px 10px; }
.card { background: var(--card); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 1px 1px #091e4240; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--tag); margin-top: 6px; }
</style>
</head>
<body>
<header><h1>Team Board</h1><a href="#">Export report</a><a href="#">Sign in</a></header>
<div class="cols">
  <div class="col"><h2>To do</h2>
    <div class="card">Write the release notes<br><span class="tag">docs</span></div>
    <div class="card">Review the onboarding flow<br><span class="tag">ux</span></div>
    <div class="card">Plan the Q1 roadmap</div>
  </div>
  <div class="col"><h2>In progress</h2>
    <div class="card">Dark theme for the dashboard<br><span class="tag">ui</span></div>
    <div class="card">Migrate the CI runners</div>
  </div>
  <div class="col"><h2>Done</h2>
    <div class="card">Fix login redirect<br><span class="tag">bug</span></div>
    <div class="card">Update dependencies</div>
    <div class="card">Weekly sync notes</div>
  </div>
</div>
</body>
</html>
